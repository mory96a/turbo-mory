name: Dev CI

on:
  push:
    branches: [dev]

jobs:
  ci:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: corepack enable
      - run: pnpm install

      - name: Run checks
        run: pnpm check:ci

      - name: Type check
        run: pnpm check-types --affected
